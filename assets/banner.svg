<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#0a0d18; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-15px, 10px); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(1.2) translate(15px, -10px); opacity: 0.5; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 220px 110px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 990px 300px; }
    .card-1 { animation: floatCard1 5.5s ease-in-out infinite; }
    .card-2 { animation: floatCard2 6.5s ease-in-out infinite; }
    .data-flow { stroke-dasharray: 6 6; animation: flowLine 2s linear infinite; }
    .dot-1 { animation: blinkDot 2.2s infinite; }
    .dot-2 { animation: blinkDot 1.8s infinite 0.7s; }
    .dot-3 { animation: blinkDot 2.5s infinite 1.2s; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="12" />
  <rect width="1200" height="420" fill="url(#grid)" rx="12" />

  <!-- Dynamic Glowing Ambient Lights (Background Layer) -->
  <g>
    <circle class="orb-1" cx="220" cy="110" r="180" fill="#0284c7" filter="url(#softGlow)" />
    <circle class="orb-2" cx="990" cy="300" r="190" fill="#7c3aed" filter="url(#softGlow)" />
    <circle cx="600" cy="40" r="140" fill="#0d9488" opacity="0.15" filter="url(#softGlow)" />
  </g>

  <!-- Animated Data Connection Lines (Middle Background) -->
  <g opacity="0.45">
    <path class="data-flow" d="M 120 330 C 260 270, 420 370, 600 330" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="data-flow" d="M 600 330 C 780 290, 940 370, 1080 320" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Subtle Dynamic Tech Nodes/Pills (Mid Layer - offset to lower canvas) -->
  <g class="card-1">
    <rect x="80" y="325" width="230" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="102" cy="346" r="5" fill="#38bdf8" class="dot-1" />
    <text x="118" y="352" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">⚡ INLINE DEDUPLICATION</text>
  </g>

  <g class="card-2">
    <rect x="475" y="335" width="250" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="497" cy="356" r="5" fill="#818cf8" class="dot-2" />
    <text x="513" y="362" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">📦 CONTENT-DEFINED CHUNKING</text>
  </g>

  <g class="card-1">
    <rect x="900" y="325" width="220" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="922" cy="346" r="5" fill="#c084fc" class="dot-3" />
    <text x="938" y="352" fill="#e2e8f0" font-size="12" font-weight="600" letter-spacing="0.5">🧊 AUTOMATED TIERING</text>
  </g>

  <!-- FOREGROUND LAYER: Brand / Title / Subtitle (Always in front & crystal clear) -->
  <g id="foreground-content">
    <!-- Top Category Tag -->
    <g transform="translate(600, 75)">
      <rect x="-180" y="-16" width="360" height="32" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#475569" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2">ENTERPRISE STORAGE ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="150" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Global Deduplication
    </text>
    <text x="600" y="202" text-anchor="middle" fill="url(#glowGrad)" font-size="40" font-weight="800" letter-spacing="-0.5">
      &amp; Storage Optimization
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="254" text-anchor="middle" fill="#94a3b8" font-size="17" font-weight="400">
      Curated Directory of Cloud SaaS Platforms, Data Reduction Engines &amp; Open-Source Tiering Systems
    </text>

    <!-- Feature Highlights Bar -->
    <g transform="translate(600, 292)">
      <text x="0" y="0" text-anchor="middle" fill="#64748b" font-size="13" font-weight="500" letter-spacing="1">
        FASTCDC &#x2022; BLAKE3 &#x2022; ZSTD &#x2022; MULTI-CLOUD LIFECYCLE &#x2022; TAPE &amp; OBJECT STORAGE
      </text>
    </g>
  </g>
</svg>
